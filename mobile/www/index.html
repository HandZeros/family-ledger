<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F3EE" />
<title>家庭账本</title>
<link rel="icon" href="icon.png" />
<style>
  :root {
    --bg: #f5f3ee; --surface: #fff; --line: #ebe7de; --text: #1e2421;
    --muted: #8c8677; --brand: #2e6b5a; --brand-soft: #e6f0ec; --danger: #b03a31;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    position: relative; overflow: hidden;
  }
  body::before, body::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(64px); opacity: .6;
  }
  body::before { width: 320px; height: 320px; background: #cfe4da; top: -110px; left: -110px; }
  body::after { width: 300px; height: 300px; background: #f2e2c6; bottom: -120px; right: -100px; }

  .card {
    position: relative; z-index: 1; width: 100%; max-width: 360px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,.9); border-radius: 26px;
    padding: 26px 22px 22px; box-shadow: 0 30px 60px -30px rgba(30,36,33,.35);
  }
  .logo {
    width: 58px; height: 58px; border-radius: 18px; overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 14px 26px -14px rgba(31,76,62,.9);
  }
  .logo img { width: 100%; height: 100%; display: block; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.3px; }
  p.desc { font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
  input {
    width: 100%; height: 48px; padding: 0 14px; border-radius: 13px;
    border: 1px solid var(--line); background: #fff; font-size: 16px; color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  input::placeholder { color: #b6b0a2; }
  button {
    width: 100%; height: 48px; margin-top: 14px; border: none; border-radius: 13px;
    font-size: 15px; font-weight: 650; color: #fff; font-family: inherit;
    background: linear-gradient(150deg, #34795f, #22513f);
    box-shadow: 0 10px 22px -12px rgba(31,76,62,.9);
    transition: transform .12s, opacity .15s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  button.ghost {
    background: var(--brand-soft); color: var(--brand); box-shadow: none;
    height: 42px; font-size: 14px; font-weight: 600;
  }
  .err {
    display: none; margin-top: 12px; font-size: 12.5px; line-height: 1.6;
    background: #fdecea; color: var(--danger); padding: 9px 12px; border-radius: 10px;
  }
  .err.on { display: block; }
  .tip { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 16px; }

  /* 正在进入账本 */
  .splash { display: none; text-align: center; padding: 18px 0 6px; }
  .splash.on { display: block; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--brand-soft); border-top-color: var(--brand);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash p { font-size: 13px; color: var(--muted); margin: 0; }
  .hide { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="icon.png" alt="" /></div>
    <h1>家庭账本</h1>

    <div class="splash" id="splash">
      <div class="spinner"></div>
      <p id="splashText">正在进入账本…</p>
    </div>

    <div id="formWrap">
      <p class="desc">连接到你自己的账本服务器。<br/>地址由家庭管理员提供。</p>

      <form id="f">
        <label for="addr">服务器地址</label>
        <input id="addr" type="text" inputmode="url" autocapitalize="none" autocorrect="off"
               spellcheck="false" placeholder="http://192.168.1.10:5257" />
        <button type="submit" id="btn">连接</button>
      </form>
      <div class="err" id="err"></div>

      <p class="tip">
        局域网：http://192.168.x.x:5257<br/>
        外网：https://你的域名（需已配置反向代理）
      </p>
    </div>
  </div>

<script>
(function () {
  var API_KEY = 'fl.api';        // 与 Web 端 app.js 约定的键，账本页直接读这个
  var SERVER_KEY = 'fl.server';  // 兼容 1.0 版留下的键
  var LEDGER = 'ledger/index.html';

  var $ = function (id) { return document.getElementById(id); };
  var input = $('addr');
  var btn = $('btn');
  var err = $('err');
  var formWrap = $('formWrap');
  var splash = $('splash');
  var splashText = $('splashText');

  function normalize(v) {
    v = (v || '').trim();
    if (!v) return '';
    if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
    return v.replace(/\/+$/, '');
  }

  function errBox(msg) {
    err.textContent = msg;
    err.classList.add('on');
  }
  function clearErr() { err.classList.remove('on'); }

  function reset() {
    formWrap.classList.remove('hide');
    splash.classList.remove('on');
    btn.disabled = false;
    btn.textContent = '连接';
  }

  function entering(url) {
    formWrap.classList.add('hide');
    splash.classList.add('on');
    splashText.textContent = '正在打开账本…';
    // 记住地址：账本页（app.js）启动时读 localStorage 的 fl.api 作为接口根地址
    localStorage.setItem(API_KEY, url);
    localStorage.setItem(SERVER_KEY, url);
    setTimeout(function () { location.href = LEDGER; }, 60);
  }

  function probe(url, auto) {
    if (!auto) {
      btn.disabled = true;
      btn.textContent = '连接中…';
    }
    formWrap.classList.remove('hide');
    splash.classList.add('on');
    splashText.textContent = auto ? '正在进入账本…' : '正在连接服务器…';

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, auto ? 3500 : 7000);

    fetch(url + '/api/health', { cache: 'no-store', signal: ctrl.signal })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        clearTimeout(timer);
        if (!data || data.status !== 'ok') throw new Error('bad');
        entering(url);
      })
      .catch(function () {
        clearTimeout(timer);
        reset();
        input.value = url;
        errBox(
          auto
            ? '连不上上次用的服务器（' + url + '）。请确认手机和服务器在同一网络，或把地址改对后重试。'
            : '连不上这台服务器。请检查地址是否正确、手机与服务器是否在同一网络，或服务是否已启动。'
        );
      });
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErr();
    var url = normalize(input.value);
    if (!url) { errBox('请填写服务器地址'); return; }
    probe(url, false);
  });

  // 已有地址：直接尝试进入账本，省去每次手动点连接
  var saved = normalize(localStorage.getItem(API_KEY) || localStorage.getItem(SERVER_KEY) || '');
  if (saved) {
    input.value = saved;
    probe(saved, true);
  } else {
    reset();
    input.addEventListener('focus', function () { input.select(); }, { once: true });
  }
})();
</script>
</body>
</html>
