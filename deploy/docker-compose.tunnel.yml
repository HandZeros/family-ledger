# 方案 B：没有公网 IP / 不想开路由器端口 —— Cloudflare Tunnel
#
# 原理：家里的容器主动向 Cloudflare 建立出站长连接，外网通过 Cloudflare 的域名访问，
#      路由器不需要任何端口映射，也不暴露家庭公网 IP。
#
# 步骤：
#   1. https://one.dash.cloudflare.com → Networks → Tunnels → Create a tunnel（选 Cloudflared）
#   2. 复制 token，填进 .env 的 CLOUDFLARE_TUNNEL_TOKEN
#   3. 在该 tunnel 的 Public Hostname 添加一条：
#        Subdomain: ledger     Domain: 你的域名
#        Service:  HTTP  →  family-ledger:5257
#   4. 启动：
#        docker compose -f docker-compose.yml -f deploy/docker-compose.tunnel.yml up -d

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: family-ledger-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?请先在 .env 中设置 CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - family-ledger
