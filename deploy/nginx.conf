# 如果你已经有 Nginx（宿主机或其他容器），把这段放进你的 server 块。
# 证书可用 certbot 申请：certbot --nginx -d ledger.example.com

server {
    listen 80;
    server_name ledger.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ledger.example.com;

    ssl_certificate     /etc/letsencrypt/live/ledger.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.example.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        # 容器部署用 127.0.0.1:5257；如果账本跑在别的机器上，改成那台机器的 IP:5257
        proxy_pass http://127.0.0.1:5257;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
